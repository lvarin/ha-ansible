db_password: "380oshJFOdnlHJZ5kqQUfwlsDV33d1T2"
db_name: "postgres"

# Keepalived shared settings (state and priority are set per host in inventory.ini)
keepalived_auth_pass: "C6wAwEGzlnV8K9trWn5EgYqHzd3598sq"
