---
# ============================================================
# Infra provisioning vars (used by create_infra.yml)
# ============================================================

state: present
os_image: Ubuntu-26.04
flavor: standard.tiny

# Project's internal network CIDR, used for inter-VM security group rules
project_cidr: "192.168.1.0/24"

# Source IPs allowed to SSH into the jump host (HAProxy-1).
# The defaults below are CSC network ranges (VPN + eduroam).
# Add your own IP/range if connecting from outside CSC networks.
internal_ips:
  - 193.166.85.0/24
  - 193.166.1.0/24
  - 193.166.2.0/24
  - 193.166.80.0/23

# VM definitions, name maps to the OpenStack server name; security_group
# must match one of the groups created in create_infra.yml.
vms:
  - { name: HAProxy-1,  security_group: sg-haproxy }
  - { name: HAProxy-2,  security_group: sg-haproxy }
  - { name: Frontend-1, security_group: sg-frontend }
  - { name: Frontend-2, security_group: sg-frontend }
  - { name: Monitoring, security_group: sg-monitoring }

# ============================================================
# Config vars (used by site.yml)
# ============================================================

# Internal IPs of the Frontend VMs, derived from ansible_host in the inventory.
frontend_1_ip: "{{ hostvars['frontend1']['ansible_host'] }}"
frontend_2_ip: "{{ hostvars['frontend2']['ansible_host'] }}"

# Floating IP UUID get it with: openstack floating ip list
floating_ip_id: "0d4a26b5-53da-48f7-ab46-3d426965035d"

# Pukki DBaaS connection settings
db_host: "128.214.254.171"
db_port: 5432
